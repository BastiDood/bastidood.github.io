autoDedupe: true

allowBuilds:
  '@tailwindcss/oxide': true
  core-js: false
  esbuild: false
  sharp: true

catalogPrune: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeStrict: true

packageExtensions:
  # Remove when a release of @astrojs/astro2tsx declares the matching runtime:
  # https://github.com/withastro/astro/issues/18642
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': '1.11.3'

saveTypes: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0

includeWorkspaceRoot: true
