name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    env:
      PUBLIC_POSTHOG_API_KEY: ${{ secrets.PUBLIC_POSTHOG_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Astro Build Cache
        uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml', 'astro.config.ts', 'src/features/articles/image-presets.ts', 'src/content/articles/**/cover.*') }}
          restore-keys: |
            ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-astro-
      - name: Check Formatting
        run: pnpm fmt
      - name: Lint Source
        run: pnpm lint
      - name: Check Astro
        run: pnpm check
      - name: Build Website
        run: pnpm build
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    name: Deployment
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
